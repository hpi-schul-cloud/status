apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "status.fullname" . }}
  labels:
    {{- include "status.labels" . | nindent 4 }}
data:
  STATUS_INITIAL_CONFIG: {{ dict "pageTitle" .Values.page.title "logoUrl" .Values.page.logoUrl "intro" .Values.page.intro "supportEmail" .Values.page.supportEmail "privacyUrl" .Values.page.privacyUrl "imprintUrl" .Values.page.imprintUrl "groups" .Values.page.groups "components" .Values.page.components | toJson | quote }}
