# Local Minikube smoke-test values. Create the referenced Secrets separately;
# never commit database credentials, session keys, or passwords in this file.
replicaCount: 1

image:
  repository: localhost/status
  tag: dev
  pullPolicy: Never

postgresql:
  enabled: true
  image: postgres:18.6-bookworm
  storage: 1Gi
  auth:
    username: status
    database: status
    existingSecret: status-db
    passwordKey: DATABASE_PASSWORD

secrets:
  existingSecret: status-secrets
  sessionSecretKey: SESSION_SECRET
  bootstrapAdminPasswordKey: BOOTSTRAP_ADMIN_PASSWORD

bootstrapAdminUser: admin
cookieSecure: false

ingress:
  enabled: false

page:
  title: Local Status Page
  intro: Local Minikube status page for development.
  supportEmail: ""
  privacyUrl: ""
  imprintUrl: ""
  groups:
    - name: Local services
  components:
    - id: api
      name: Status API
      description: Example component for the local deployment.
      componentGroup: Local services
    - id: database
      name: PostgreSQL
      description: Example component for the local deployment.
      componentGroup: Local services
